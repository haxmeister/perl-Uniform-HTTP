name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl:
          - '5.16'
          - '5.38'
          - 'latest'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Build distribution
        run: |
          perl Makefile.PL
          make distcheck
          make dist

      - name: Install distribution dependencies
        run: cpanm --notest --installdeps ./Uniform-HTTP-*.tar.gz

      - name: Build and test
        run: |
          perl Makefile.PL
          make test
          make disttest

      - name: Check POD syntax
        run: |
          find lib -name '*.pm' -print0 | xargs -0 -n1 podchecker

      - name: Prove compiler-free installation
        run: perl author/check-pure-perl.pl

      - name: Native consumer conformance
        run: |
          perl author/native/build.pl
          prove author/native.t
